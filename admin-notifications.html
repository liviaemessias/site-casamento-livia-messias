<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com https://challenges.cloudflare.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notificações | Painel Admin | Livia & Messias</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/admin.css" />
  </head>
  <body class="admin-auth-pending">
    <main class="admin-page admin-notifications-page">
      <section class="admin-header">
        <div>
          <p class="section-subtitle">Painel Administrativo</p>
          <h1>Notificações</h1>
        </div>
        <button id="logoutButton" class="admin-logout">Sair</button>
      </section>

      <nav class="admin-nav" aria-label="Navegação administrativa">
        <a class="admin-nav-link" href="./admin-dashboard.html">Dashboard</a>
        <a class="admin-nav-link" href="./admin-gifts.html">Presentes</a>
        <a class="admin-nav-link" href="./admin-rsvps.html">RSVP</a>
        <a class="admin-nav-link" href="./admin-guests.html">Convidados</a>
        <a class="admin-nav-link active" href="./admin-notifications.html">
          Notificações
        </a>
        <a class="admin-nav-link" href="./admin-settings.html">
          Configurações
        </a>
      </nav>

      <section class="admin-section" id="notifications">
        <div class="admin-section-header">
          <div>
            <p class="section-subtitle">Auditoria</p>
            <h2>Histórico de Notificações</h2>
          </div>

          <div class="admin-section-actions">
            <button id="refreshNotificationsButton" class="admin-action-button icon-action">
              <i data-lucide="refresh-cw" aria-hidden="true"></i>
              Atualizar
            </button>
          </div>
        </div>

        <section class="admin-grid dashboard-grid notification-summary-grid" aria-label="Resumo das notificações">
          <article
            class="admin-card notification-summary-card"
            data-notification-summary-status="sent"
            role="button"
            tabindex="0"
          >
            <div class="admin-card-header">
              <span>Enviadas</span>
              <button
                type="button"
                class="metric-help"
                aria-label="Ajuda sobre notificações enviadas"
                data-tooltip="Entregas de e-mail aceitas pelo SMTP e registradas como enviadas."
              >
                ?
              </button>
            </div>
            <strong id="notificationSentCount">0</strong>
          </article>
          <article
            class="admin-card notification-summary-card"
            data-notification-summary-status="failed"
            role="button"
            tabindex="0"
          >
            <div class="admin-card-header">
              <span>Falhas</span>
              <button
                type="button"
                class="metric-help"
                aria-label="Ajuda sobre falhas de notificação"
                data-tooltip="Entregas que falharam durante o processamento e precisam de revisão."
              >
                ?
              </button>
            </div>
            <strong id="notificationFailedCount">0</strong>
          </article>
          <article
            class="admin-card notification-summary-card"
            data-notification-summary-status="skipped"
            role="button"
            tabindex="0"
          >
            <div class="admin-card-header">
              <span>Ignoradas</span>
              <button
                type="button"
                class="metric-help"
                aria-label="Ajuda sobre notificações ignoradas"
                data-tooltip="Entregas não enviadas intencionalmente, normalmente por ausência de e-mail válido do convidado."
              >
                ?
              </button>
            </div>
            <strong id="notificationSkippedCount">0</strong>
          </article>
          <article
            class="admin-card notification-summary-card"
            data-notification-summary-status="pending"
            role="button"
            tabindex="0"
          >
            <div class="admin-card-header">
              <span>Pendentes</span>
              <button
                type="button"
                class="metric-help"
                aria-label="Ajuda sobre notificações pendentes"
                data-tooltip="Eventos ou entregas ainda pendentes ou em processamento."
              >
                ?
              </button>
            </div>
            <strong id="notificationPendingCount">0</strong>
          </article>
        </section>

        <div class="admin-filters" aria-label="Filtros de notificações">
          <div class="admin-filter-field">
            <label for="notificationSearchInput">Busca</label>
            <input
              type="search"
              id="notificationSearchInput"
              placeholder="Convidado, e-mail, presente, ID ou motivo"
              autocomplete="off"
            />
          </div>

          <div class="admin-filter-field">
            <label for="notificationStatusFilter">Status</label>
            <select id="notificationStatusFilter">
              <option value="">Todos</option>
              <option value="sent">Enviadas</option>
              <option value="failed">Falhas</option>
              <option value="skipped">Ignoradas</option>
              <option value="pending">Pendentes</option>
              <option value="processing">Processando</option>
              <option value="processed">Processadas</option>
            </select>
          </div>

          <div class="admin-filter-field">
            <label for="notificationTypeFilter">Tipo</label>
            <select id="notificationTypeFilter">
              <option value="">Todos</option>
              <option value="rsvp_saved">RSVP</option>
              <option value="wall_message_submitted">Recado enviado</option>
              <option value="wall_message_approved">Recado aprovado</option>
              <option value="wall_message_replied">Recado respondido</option>
              <option value="gift_reserved">Presente reservado</option>
              <option value="gift_reservation_reminder">Lembrete de presente</option>
              <option value="gift_payment_reported">Pagamento informado</option>
              <option value="gift_purchase_confirmed">Presente confirmado</option>
              <option value="gift_reservation_released">Presente liberado</option>
              <option value="gift_contribution_reserved">Cota reservada</option>
              <option value="gift_contribution_reminder">Lembrete de cota</option>
              <option value="gift_contribution_payment_reported">Pagamento de cota informado</option>
              <option value="gift_contribution_confirmed">Cota confirmada</option>
              <option value="gift_contribution_released">Cota liberada</option>
            </select>
          </div>

          <div class="admin-filter-field">
            <label for="notificationOriginFilter">Origem</label>
            <select id="notificationOriginFilter">
              <option value="">Todas</option>
              <option value="automatic">Automática</option>
              <option value="manual">Manual</option>
            </select>
          </div>

          <div class="admin-filter-field">
            <label for="notificationRecipientFilter">Destinatário</label>
            <select id="notificationRecipientFilter">
              <option value="">Todos</option>
              <option value="admin">Admin</option>
              <option value="guest">Convidado</option>
            </select>
          </div>

          <div class="admin-filter-field">
            <label for="notificationPeriodFilter">Período</label>
            <select id="notificationPeriodFilter">
              <option value="">Todos</option>
              <option value="today">Hoje</option>
              <option value="7">Últimos 7 dias</option>
              <option value="30">Últimos 30 dias</option>
            </select>
          </div>

          <div class="admin-filter-actions">
            <span id="notificationFilterCount" class="admin-filter-count"></span>
            <button
              type="button"
              id="clearNotificationFiltersButton"
              class="admin-clear-filters"
            >
              Limpar Filtros
            </button>
          </div>
        </div>

        <div class="admin-table-wrapper">
          <table class="admin-table notifications-table">
            <thead>
              <tr>
                <th>
                  <button class="admin-sort-button" data-notification-sort="created_at">
                    Data
                  </button>
                </th>
                <th>
                  <button class="admin-sort-button" data-notification-sort="event_type">
                    Tipo
                  </button>
                </th>
                <th>
                  <button class="admin-sort-button" data-notification-sort="guest_name">
                    Convidado
                  </button>
                </th>
                <th>
                  <button class="admin-sort-button" data-notification-sort="recipient_type">
                    Destinatário
                  </button>
                </th>
                <th>
                  <button class="admin-sort-button" data-notification-sort="recipient_email">
                    E-mail
                  </button>
                </th>
                <th>
                  <button class="admin-sort-button" data-notification-sort="status">
                    Status
                  </button>
                </th>
                <th>Motivo</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="notificationsTableBody"></tbody>
          </table>
        </div>

        <div class="admin-pagination" aria-label="Paginação de notificações">
          <button
            type="button"
            id="previousNotificationsPageButton"
            class="admin-action-button icon-only pagination-icon-button"
            aria-label="Página anterior"
            title="Página anterior"
          >
            <i data-lucide="chevron-left" aria-hidden="true"></i>
          </button>
          <span id="notificationsPaginationStatus" class="admin-pagination-status">
            Exibindo 0 registros
          </span>
          <button
            type="button"
            id="nextNotificationsPageButton"
            class="admin-action-button icon-only pagination-icon-button"
            aria-label="Próxima página"
            title="Próxima página"
          >
            <i data-lucide="chevron-right" aria-hidden="true"></i>
          </button>
        </div>
      </section>
    </main>

    <div class="admin-modal" id="notificationDetailsModal">
      <div class="admin-modal-content admin-details-modal-content">
        <button
          type="button"
          class="admin-modal-close"
          id="closeNotificationDetailsModalButton"
        >
          &times;
        </button>

        <h2 id="notificationDetailsTitle">Detalhes da Notificação</h2>
        <div id="notificationDetailsContent" class="admin-details-content"></div>
      </div>
    </div>

    <div id="adminToast" class="admin-toast"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="./js/supabase.js"></script>
    <script src="./js/event-config.js"></script>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="./js/admin-common.js"></script>
    <script src="./js/admin-bootstrap.js"></script>
  </body>
</html>
