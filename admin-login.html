<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com https://challenges.cloudflare.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acesso Administrativo | Livia & Messias</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body class="admin-login-page">
    <main class="login-container admin-login-container">
      <a class="login-logo-link" href="./index.html" aria-label="Voltar para o início">
        <img
          src="./assets/images/brand/couple-logo-primary.svg"
          alt="Livia e Messias"
          class="login-couple-logo"
        />
      </a>
      <span class="login-eyebrow">Painel Administrativo</span>
      <p>Entre com o e-mail e a senha da conta administrativa.</p>

      <form id="adminLoginForm" class="login-form">
        <div class="login-field">
          <label for="adminEmail">E-mail</label>
          <input
            type="email"
            id="adminEmail"
            name="email"
            autocomplete="username"
            required
          />
        </div>

        <div class="login-field">
          <label for="adminPassword">Senha</label>
          <input
            type="password"
            id="adminPassword"
            name="password"
            autocomplete="current-password"
            required
          />
        </div>

        <div
          id="adminCaptcha"
          class="captcha-container"
          aria-label="Validação de segurança"
          hidden
        ></div>

        <button type="submit" id="adminLoginButton">Entrar</button>
      </form>

      <div id="loginError" class="login-feedback" aria-live="polite"></div>

      <a class="login-secondary-link" href="login.html">
        Entrar com Código de Convite
      </a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/event-config.js"></script>
    <script src="js/event-settings.js"></script>
    <script src="js/captcha-config.js"></script>
    <script src="js/turnstile-captcha.js"></script>
    <script src="js/reference-decorations.js"></script>
    <script src="js/admin-login.js"></script>
  </body>
</html>
