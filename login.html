  <body class="guest-login-page">
    <header class="navbar navbar-light" id="navbar">
      <div class="container nav-content">
        <a href="index.html" class="logo" data-wedding-names>Livia & Messias</a>

        <nav>
          <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Início</a></li>
            <li><a href="index.html#ceremony">Cerimônia</a></li>
            <li><a href="index.html#reception">Recepção</a></li>
            <li><a href="login.html?redirect=rsvp">RSVP</a></li>
            <li><a href="login.html?redirect=gifts">Presentes</a></li>
            <li><a href="our-story.html">Nossa História</a></li>
            <li class="nav-dropdown">
              <button type="button" class="nav-dropdown-toggle" aria-expanded="false">
                Mais
              </button>
              <ul class="nav-dropdown-menu">
                <li><a href="login.html?redirect=schedule">Programação</a></li>
                <li><a href="photos.html">Pré-Wedding</a></li>
                <li><a href="messages.html">Recados</a></li>
                <li><a href="vendors.html">Fornecedores</a></li>
              </ul>
            </li>
          </ul>
        </nav>

        <button type="button" class="mobile-menu" id="mobileMenu" aria-label="Abrir menu" aria-expanded="false">☰</button>
      </div>
    </header>

    <div class="login-container">
      <a class="login-logo-link" href="./index.html" aria-label="Voltar para o início">
        <img
          src="./assets/images/brand/couple-logo-primary.svg"
          alt="Livia e Messias"
          class="login-couple-logo"
        />
      </a>
      <p>Digite seu código de convite</p>
      <form id="loginForm" class="login-form">
        <input
          type="text"
          id="inviteCode"
          placeholder="Digite aqui"
          required
        />
        <div
          id="guestCaptcha"
          class="captcha-container"
          aria-label="Validação de segurança"
          hidden
        ></div>
        <button type="submit">Entrar</button>
      </form>
      <div id="loginError"></div>
      <a class="login-secondary-link" href="admin-login.html">
        Acesso Administrativo
      </a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
