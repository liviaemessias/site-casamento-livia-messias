<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com https://challenges.cloudflare.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>RSVP | Painel Admin | Livia & Messias</title>

    <link rel="stylesheet" href="./css/style.css" />

    <link rel="stylesheet" href="./css/admin.css" />
  </head>

  <body class="admin-auth-pending">
    <main class="admin-page">
      <section class="admin-header">
        <div>
          <p class="section-subtitle">Painel Administrativo</p>

          <h1>RSVP</h1>
        </div>

        <button id="logoutButton" class="admin-logout">Sair</button>
      </section>

      <nav class="admin-nav" aria-label="Navegação administrativa">
        <a class="admin-nav-link" href="./admin-dashboard.html">Dashboard</a>
        <a class="admin-nav-link" href="./admin-gifts.html">Presentes</a>
        <a class="admin-nav-link active" href="./admin-rsvps.html">RSVP</a>
        <a class="admin-nav-link" href="./admin-guests.html">Convidados</a>
        <a class="admin-nav-link" href="./admin-settings.html">
          Configurações
        </a>
      </nav>

      <section class="admin-section" id="rsvps">
        <div class="admin-section-header">
          <div>
            <p class="section-subtitle">RSVP</p>

            <h2>Confirmações de Presença</h2>
          </div>

          <div class="admin-section-actions">
            <button id="refreshRSVPsButton" class="admin-action-button icon-action">
              <i data-lucide="refresh-cw" aria-hidden="true"></i>
              Atualizar
            </button>

            <button id="exportRSVPsButton" class="admin-action-button icon-action">
              <i data-lucide="download" aria-hidden="true"></i>
              Exportar CSV
            </button>

            <a class="admin-action-button icon-action success" href="./admin-guests.html">
              <i data-lucide="plus" aria-hidden="true"></i>
              RSVP manual
            </a>
          </div>
        </div>

        <div class="admin-filters" aria-label="Filtros de RSVP">
          <div class="admin-filter-field">
            <label for="rsvpSearchInput">Buscar</label>
            <input
              type="search"
              id="rsvpSearchInput"
              placeholder="Convidado, acompanhante ou mensagem"
            />
          </div>

          <div class="admin-filter-field">
            <label for="rsvpPresenceFilter">Presença</label>
            <select id="rsvpPresenceFilter">
              <option value="">Todas</option>
              <option value="Sim">Sim</option>
              <option value="Não">Não</option>
            </select>
          </div>

          <div class="admin-filter-field">
            <label for="rsvpCompanionFilter">Acompanhantes</label>
            <select id="rsvpCompanionFilter">
              <option value="">Todos</option>
              <option value="with">Com acompanhantes</option>
              <option value="without">Sem acompanhantes</option>
            </select>
          </div>

          <div class="admin-filter-field">
            <label for="rsvpRestrictionFilter">Restrição Alimentar</label>
            <select id="rsvpRestrictionFilter">
              <option value="">Todas</option>
              <option value="with">Com restrição</option>
              <option value="without">Sem restrição</option>
            </select>
          </div>

          <div class="admin-filter-field">
            <label for="rsvpBuffetFilter">Buffet</label>
            <select id="rsvpBuffetFilter">
              <option value="">Todas as Categorias</option>
              <option value="paying">Com Pagantes</option>
              <option value="children">Com Crianças</option>
              <option value="child-paying">Com Criança Pagante</option>
              <option value="child-non-paying">
                Com Criança Não Pagante
              </option>
              <option value="child-unknown">Com Criança Sem Idade</option>
            </select>
          </div>

          <div class="admin-filter-actions">
            <span id="rsvpFilterCount" class="admin-filter-count"></span>

            <button
              type="button"
              id="clearRSVPFiltersButton"
              class="admin-clear-filters"
            >
              Limpar Filtros
            </button>
          </div>
        </div>

        <div class="admin-table-wrapper">
          <table class="admin-table rsvps-table">
            <thead>
              <tr>
                <th>
                  <button class="admin-sort-button" data-rsvp-sort="guest">
                    Convidado
                  </button>
                </th>
                <th>
                  <button class="admin-sort-button" data-rsvp-sort="presence">
                    Presença
                  </button>
                </th>
                <th>
                  <button class="admin-sort-button" data-rsvp-sort="companions">
                    Qtd.
                  </button>
                </th>
                <th>Acompanhantes</th>
                <th>Mensagem</th>
                <th>
                  <button class="admin-sort-button" data-rsvp-sort="updated">
                    Atualizado em
                  </button>
                </th>
                <th>Ações</th>
              </tr>
            </thead>

            <tbody id="rsvpsTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <div class="admin-modal" id="rsvpDetailsModal">
      <div class="admin-modal-content admin-details-modal-content">
        <button
          type="button"
          class="admin-modal-close"
          id="closeRSVPDetailsModalButton"
          aria-label="Fechar detalhes do RSVP"
        >
          ×
        </button>

        <h2 id="rsvpDetailsTitle">Detalhes do RSVP</h2>

        <div id="rsvpDetailsContent" class="admin-details-content"></div>
      </div>
    </div>

    <div class="admin-modal" id="adminRSVPModal">
      <div class="admin-modal-content">
        <button
          type="button"
          class="admin-modal-close"
          id="closeAdminRSVPModalButton"
          aria-label="Fechar edição do RSVP"
        >
          ×
        </button>

        <h2 id="adminRSVPModalTitle">Editar RSVP</h2>

        <form id="adminRSVPForm">
          <div class="admin-form-group">
            <label> E-mail </label>
            <input type="email" id="adminRSVPEmailInput" />
          </div>

          <div class="admin-form-group">
            <label> Telefone / WhatsApp </label>
            <input
              type="tel"
              id="adminRSVPPhoneInput"
              placeholder="(85) 99999-9999"
            />
          </div>

          <div id="adminRSVPPresenceGroup" class="admin-form-group">
            <label> Presença </label>

            <select id="adminRSVPPresenceInput">
              <option value="Sim">Sim</option>
              <option value="Não">Não</option>
            </select>
          </div>

          <div id="adminRSVPCoupleMembers" class="is-hidden"></div>

          <div class="admin-form-group">
            <label> Quantidade de Acompanhantes </label>
            <select id="adminRSVPGuestCountInput"></select>
          </div>

          <div id="adminRSVPGuestFields"></div>

          <div class="admin-form-group">
            <label for="adminRSVPFoodRestrictionInput">
              Possui Restrição Alimentar?
            </label>
            <select id="adminRSVPFoodRestrictionInput">
              <option value="Não">Não</option>
              <option value="Sim">Sim</option>
            </select>
          </div>

          <div
            id="adminRSVPFoodDetailsGroup"
            class="admin-form-group is-hidden"
            hidden
          >
            <label> Qual Restrição Alimentar? </label>
            <input
              type="text"
              id="adminRSVPFoodInput"
              placeholder="Ex.: intolerância à lactose ou alergia a frutos do mar"
            />
          </div>

          <div class="admin-form-group">
            <label> Mensagem </label>
            <textarea id="adminRSVPMessageInput" rows="4"></textarea>
          </div>

          <button
            type="button"
            id="deleteAdminRSVPButton"
            class="admin-action-button danger is-full-width has-bottom-space is-hidden"
          >
            Remover confirmação
          </button>

          <button type="submit" class="admin-save-button">
            Salvar confirmação
          </button>
        </form>
      </div>
    </div>

    <div id="adminToast" class="admin-toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

    <script src="./js/supabase.js"></script>
    <script src="./js/event-config.js"></script>

    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>

    <script src="./js/admin-common.js"></script>

    <script src="./js/admin-bootstrap.js"></script>
  </body>
</html>
